# Render Blueprint — one service running the whole app.
#
# The build compiles the frontend into frontend/dist, and the Express server
# serves those files alongside /api/*. One URL, so no CORS to configure and
# only one free-tier service to keep awake.
#
# In Render: New > Blueprint > pick this repo.
# Values marked sync:false are typed into the dashboard, never committed here.
services:
  - type: web
    name: tradotsav
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT itself — do not set it.
      - key: DB_MODE
        value: mongo
      - key: MONGO_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: REQUIRE_PHONE_VERIFICATION
        value: "false"
      - key: EXPIRY_WARNING_MINUTES
        value: "1440"

      # Baked into the JS bundle at build time — changing these needs a redeploy.
      - key: VITE_ADMIN_USER
        sync: false
      - key: VITE_ADMIN_PASS
        sync: false

      # Optional: real SMS for the signup OTP. Leave blank and the code is
      # shown on screen instead.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # Not needed while the frontend is served from this same service.
      # Set it only if you host the frontend somewhere else.
      # - key: CORS_ORIGIN
      #   sync: false
